<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Rutes - Mallorca</title>
    <link rel="stylesheet" href="css/galeria.css">
</head>

<body>

    <header>
        <h1>[Nom de la teva botiga]</h1>


        <nav>
            <ul>
                <li><a href="index.html">Inici</a></li>
                <li><a href="galeria.html" class="actiu">Galeria</a></li>
                <li><a href="contacte.html">Contacte</a></li>
            </ul>
        </nav>

        <p class="banner">Lloga la bici per a qualsevol d’aquestes rutes: 15 € el dia</p>
    </header>

    <main>
        <h2>Rutes en bici per Mallorca</h2>

        <div class="galeria">
            <!-- 1. Sa Calobra -->
            <figure>
                <img src="img/sa_calobra.jpg"
                    alt="Carretera de revolts molt tancats de fons entre penya-segats de la serra de Tramuntana">
                <figcaption>Sa Calobra <span class="km">· 38 km</span></figcaption>
            </figure>

            <!-- 2. Cap de Formentor -->
            <figure>
                <img src="img/formentor.jpg"
                    alt="Far de Formentor dalt d'un penya-segat imponent al final de la carretera">
                <figcaption>Cap de Formentor <span class="km">· 42 km</span></figcaption>
            </figure>

            <!-- 3. Valldemossa -->
            <figure>
                <img src="img/valldemossa.jpg"
                    alt="Vista del poble de Valldemossa entre muntanyes amb la seva famosa cartoixa">
                <figcaption>Valldemossa <span class="km">· 30 km</span></figcaption>
            </figure>

            <!-- 4. Port de Sóller -->
            <figure>
                <img src="img/port_soller.jpg"
                    alt="Badia del Port de Sóller amb barques amarrades i el tramvia passant a prop">
                <figcaption>Port de Sóller <span class="km">· 25 km</span></figcaption>
            </figure>

            <!-- 5. Els ametllers en flor -->
            <figure>
                <img src="img/ametllers.jpg"
                    alt="Camp mallorquí ple d'ametllers florits amb flors blanques i rosades a l'hivern">
                <figcaption>Els ametllers en flor <span class="km">· 35 km</span></figcaption>
            </figure>

            <!-- 6. Es Trenc -->
            <figure>
                <img src="img/es_trenc.jpg"
                    alt="Platja verge d'Es Trenc amb sorra blanca fina i aigües totalment cristal·lines">
                <figcaption>Es Trenc <span class="km">· 28 km</span></figcaption>
            </figure>

            <!-- 7. Santuari de Lluc -->
            <figure>
                <img src="img/lluc.jpg"
                    alt="Façana principal del Santuari de Lluc envoltat de la naturalesa de la Tramuntana">
                <figcaption>Santuari de Lluc <span class="km">· 45 km</span></figcaption>
            </figure>

            <!-- 8. Pont romà de Pollença -->
            <figure>
                <img src="img/pollenca.jpg" alt="Antic pont de pedra d'origen romà que creua el torrent a Pollença">
                <figcaption>Pont romà de Pollença <span class="km">· 20 km</span></figcaption>
            </figure>

            <!-- 9. Ses Salines -->
            <figure>
                <img src="img/salines.jpg" alt="Basses de sal de les Salines amb muntanyes de sal blanca al fons">
                <figcaption>Ses Salines <span class="km">· 32 km</span></figcaption>
            </figure>
        </div>
    </main>

</html>
